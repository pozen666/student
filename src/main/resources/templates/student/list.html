<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学生管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">学生成绩管理系统</a>
            <div class="collapse navbar-collapse show" id="nav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="/students">学生管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/courses">课程管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/scores">成绩管理</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>学生列表</h3>
            <a href="/students/add" class="btn btn-primary">添加学生</a>
        </div>

        <form class="row g-2 mb-3" method="get" action="/students">
            <div class="col-auto">
                <input type="text" class="form-control" name="keyword" placeholder="学号/姓名/班级" th:value="${keyword}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">搜索</button>
                <a href="/students" class="btn btn-outline-secondary">清除</a>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>班级</th>
                        <th>电话</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${students}">
                        <td th:text="${s.studentNo}"></td>
                        <td th:text="${s.name}"></td>
                        <td th:text="${s.gender}"></td>
                        <td th:text="${s.className}"></td>
                        <td th:text="${s.phone}"></td>
                        <td>
                            <a th:href="@{/students/edit/{no}(no=${s.studentNo})}" class="btn btn-sm btn-warning">修改</a>
                            <a th:href="@{/students/delete/{no}(no=${s.studentNo})}" class="btn btn-sm btn-danger" onclick="return confirm('确认删除？')">删除</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a href="/" class="btn btn-outline-secondary">返回首页</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
