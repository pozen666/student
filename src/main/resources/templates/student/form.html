<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${student.id != null} ? '修改学生' : '添加学生'">表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">学生成绩管理系统</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header" th:text="${student.id != null} ? '修改学生' : '添加学生'"></div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="${student.id != null} ? @{/students/edit} : @{/students/add}" method="post">
                    <div class="mb-3">
                        <label class="form-label">学号</label>
                        <input type="text" class="form-control" name="studentNo" th:value="${student.studentNo}"
                               th:readonly="${student.id != null}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">姓名</label>
                        <input type="text" class="form-control" name="name" th:value="${student.name}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">性别</label>
                        <select class="form-select" name="gender">
                            <option value="男" th:selected="${student.gender == '男'}">男</option>
                            <option value="女" th:selected="${student.gender == '女'}">女</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">班级</label>
                        <input type="text" class="form-control" name="className" th:value="${student.className}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">电话</label>
                        <input type="text" class="form-control" name="phone" th:value="${student.phone}">
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="/students" class="btn btn-outline-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
