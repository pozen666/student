<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>课程管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">学生成绩管理系统</a>
            <div class="collapse navbar-collapse show" id="nav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/students">学生管理</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/courses">课程管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/scores">成绩管理</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>课程列表</h3>
            <a href="/courses/add" class="btn btn-primary">添加课程</a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th>课程编号</th>
                        <th>课程名称</th>
                        <th>授课教师</th>
                        <th>学分</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${courses}">
                        <td th:text="${c.courseNo}"></td>
                        <td th:text="${c.name}"></td>
                        <td th:text="${c.teacher}"></td>
                        <td th:text="${c.credit}"></td>
                        <td>
                            <a th:href="@{/courses/edit/{no}(no=${c.courseNo})}" class="btn btn-sm btn-warning">修改</a>
                            <a th:href="@{/courses/delete/{no}(no=${c.courseNo})}" class="btn btn-sm btn-danger" onclick="return confirm('确认删除？')">删除</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a href="/" class="btn btn-outline-secondary">返回首页</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
