<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${course.id != null} ? '修改课程' : '添加课程'">表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">学生成绩管理系统</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header" th:text="${course.id != null} ? '修改课程' : '添加课程'"></div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="${course.id != null} ? @{/courses/edit} : @{/courses/add}" method="post">
                    <div class="mb-3">
                        <label class="form-label">课程编号</label>
                        <input type="text" class="form-control" name="courseNo" th:value="${course.courseNo}"
                               th:readonly="${course.id != null}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">课程名称</label>
                        <input type="text" class="form-control" name="name" th:value="${course.name}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">授课教师</label>
                        <input type="text" class="form-control" name="teacher" th:value="${course.teacher}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">学分</label>
                        <input type="number" step="0.1" class="form-control" name="credit" th:value="${course.credit}">
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="/courses" class="btn btn-outline-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
