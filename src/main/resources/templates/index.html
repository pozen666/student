<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学生成绩管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">学生成绩管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/students">学生管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/courses">课程管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/scores">成绩管理</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card text-bg-primary">
                    <div class="card-body text-center py-5">
                        <h3 class="card-title display-6">学生管理</h3>
                        <p class="card-text">添加、修改、删除和查询学生信息</p>
                        <a href="/students" class="btn btn-light">进入管理</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-bg-success">
                    <div class="card-body text-center py-5">
                        <h3 class="card-title display-6">课程管理</h3>
                        <p class="card-text">添加、修改、删除和查询课程信息</p>
                        <a href="/courses" class="btn btn-light">进入管理</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-bg-warning">
                    <div class="card-body text-center py-5">
                        <h3 class="card-title display-6">成绩管理</h3>
                        <p class="card-text">录入、修改、删除和查询考试成绩</p>
                        <a href="/scores" class="btn btn-light">进入管理</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
