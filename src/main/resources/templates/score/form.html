<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${score.id != null} ? '修改成绩' : '录入成绩'">表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">学生成绩管理系统</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header" th:text="${score.id != null} ? '修改成绩' : '录入成绩'"></div>
            <div class="card-body">
                <form th:action="${score.id != null} ? @{/scores/edit} : @{/scores/add}" method="post">
                    <div class="mb-3">
                        <label class="form-label">学生</label>
                        <select class="form-select" name="studentNo" required>
                            <option value="">--请选择--</option>
                            <option th:each="s : ${students}" th:value="${s.studentNo}"
                                    th:text="${s.studentNo + ' - ' + s.name}"
                                    th:selected="${score.studentNo == s.studentNo}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">课程</label>
                        <select class="form-select" name="courseNo" required>
                            <option value="">--请选择--</option>
                            <option th:each="c : ${courses}" th:value="${c.courseNo}"
                                    th:text="${c.courseNo + ' - ' + c.name}"
                                    th:selected="${score.courseNo == c.courseNo}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">成绩</label>
                        <input type="number" step="0.01" class="form-control" name="scoreVal" th:value="${score.score}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">考试日期</label>
                        <input type="date" class="form-control" name="examDate" th:value="${score.examDate}">
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="/scores" class="btn btn-outline-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
